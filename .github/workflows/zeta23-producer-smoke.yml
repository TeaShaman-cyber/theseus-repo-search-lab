name: Zeta23 repository lens producer smoke

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/producer_guard.py"
      - "scripts/replay_zeta23.py"
      - "producer/zeta23.json"
      - "pyproject.toml"
      - ".github/workflows/zeta23-producer-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeta23-repo-lens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository lens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load pinned producer configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pins = json.loads(Path("producer/zeta23.json").read_text())
          mapping = {
              "SOURCE_REPO": pins["source_repo"],
              "SOURCE_COMMIT": pins["source_commit"],
              "SOURCE_SUBDIR": pins["source_subdir"],
              "ROOT_MODULE": pins["root_module"],
              "EXTRACTOR_REPO": pins["extractor_repo"],
              "EXTRACTOR_COMMIT": pins["extractor_commit"],
              "EXTRACTOR_MAIN_SHA256": pins["extractor_main_sha256"],
              "ELAN_VERSION": pins["elan_version"],
              "ELAN_SHA256": pins["elan_sha256"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for key, value in mapping.items():
                  fh.write(f"{key}={value}\n")
          PY

      - name: Checkout pinned target through producer guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py checkout \
            --repo-url "https://github.com/${SOURCE_REPO}.git" \
            --commit "$SOURCE_COMMIT" \
            --dest _target/formal-math

      - name: Verify exact source readback
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py verify \
            --repo-dir _target/formal-math \
            --expected "$SOURCE_COMMIT"
          printf 'source_readback=%s\n' "$(git -C _target/formal-math rev-parse HEAD)"

      - name: Install pinned Elan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Mathlib cache and build Zeta23
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py run \
            --cwd _target/formal-math/zeta23 -- lake exe cache get
          python3 scripts/producer_guard.py run \
            --cwd _target/formal-math/zeta23 -- lake build Zeta23

      - name: Fetch pinned standalone LeanDepViz extractor
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/${EXTRACTOR_REPO}/${EXTRACTOR_COMMIT}/LeanDepViz/Main.lean"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/LeanDepVizMain.lean" "$url"
          echo "${EXTRACTOR_MAIN_SHA256}  $RUNNER_TEMP/LeanDepVizMain.lean" | sha256sum --check

      - name: Extract exact declaration graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _out
          python3 scripts/producer_guard.py run \
            --cwd _target/formal-math/zeta23 -- \
            lake env lean --run "$RUNNER_TEMP/LeanDepVizMain.lean" \
            --roots "$ROOT_MODULE" \
            --json-out "$GITHUB_WORKSPACE/_out/raw-depgraph.json"

      - name: Install repository lens package
        run: python3 -m pip install -e .

      - name: Build normalized artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m theseus_repo_search build-artifact \
            --source-root _target/formal-math/zeta23 \
            --source-repo "$SOURCE_REPO" \
            --source-commit "$SOURCE_COMMIT" \
            --source-subdir "$SOURCE_SUBDIR" \
            --root-module "$ROOT_MODULE" \
            --producer-kind lean-dep-viz \
            --producer-tool-repo "$EXTRACTOR_REPO" \
            --producer-tool-commit "$EXTRACTOR_COMMIT" \
            --producer-tool-hash "$EXTRACTOR_MAIN_SHA256" \
            --authoritative-readback \
            --raw-depgraph _out/raw-depgraph.json \
            --out _out/artifact

      - name: Verify normalized artifact
        run: python3 -m theseus_repo_search verify-artifact --artifact _out/artifact

      - name: Build disposable search projection
        run: python3 -m theseus_repo_search build-index --artifact _out/artifact --db _out/index.sqlite

      - name: Replay registered Zeta23 queries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/replay_zeta23.py \
            --db _out/index.sqlite \
            --source-root _target/formal-math/zeta23 \
            --out _out/replay.json

      - name: Remove non-authoritative temporary projections
        shell: bash
        run: |
          set -euo pipefail
          rm -f _out/raw-depgraph.json _out/index.sqlite
          test ! -e _out/raw-depgraph.json
          test ! -e _out/index.sqlite

      - name: Upload normalized repository lens artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zeta23-repo-index-v1
          path: |
            _out/artifact/
            _out/replay.json
          if-no-files-found: error
