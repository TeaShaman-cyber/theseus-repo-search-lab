name: Accepted graph scope inventory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: accepted-graph-scope-inventory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify immutable artifacts and enumerate scope loss
        run: python3 scripts/audit_accepted_graph_scope.py --shard ${{ matrix.shard }} --out _audit/shard-${{ matrix.shard }}.json
      - name: Retain partial or complete audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scope-inventory-${{ matrix.shard }}
          path: _audit/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
