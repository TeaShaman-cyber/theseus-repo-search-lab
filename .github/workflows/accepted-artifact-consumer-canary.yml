name: Lean native lexical oracle pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      ELAN_VERSION: v4.2.3
      ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto "=https" --tlsv1.2 --output "$RUNNER_TEMP/elan.tar.gz" "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Native elaboration and declaration range comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _oracle
          lean +leanprover/lean4:v4.34.1 --version | tee _oracle/version.txt
          lean +leanprover/lean4:v4.34.1 tests/fixtures/lean_lexical_oracle.lean | tee _oracle/native.log
          python3 scripts/check_lean_lexical_oracle.py tests/fixtures/lean_lexical_oracle.lean _oracle/native.log | tee _oracle/comparison.txt
      - name: Retain pilot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lean-native-lexical-oracle
          path: _oracle/
          if-no-files-found: ignore
          retention-days: 7
