name: Marton exact-source Lean axiom witness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marton-axiom-witness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  witness:
    if: ${{ github.ref == 'refs/heads/experiment/34-marton-witness-registered-route' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout witness code at exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve pinned Marton source configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 scripts/load_producer_env.py \
            --source producer/sources/annals-challenge-marton.json \
            --runner producer/runner.json \
            --github-env "$GITHUB_ENV"

      - name: Fetch pinned upstream without pulling entire corpus matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py checkout \
            --repo-url "https://github.com/${SOURCE_REPO}.git" \
            --commit "$SOURCE_COMMIT" --dest _target/source
          python3 scripts/producer_guard.py verify \
            --repo-dir _target/source --expected "$SOURCE_COMMIT"
          test "$(sha256sum _target/source/AnnalsChallenge/AnnalsOfMathematics/2025-201-2-ConjectureOfMarton.lean | cut -d ' ' -f 1)" = "a07d6d29b17aca763e05952382612dac0451405895deefa13bee94d9ea518fab"
          test "$(cat _target/source/lean-toolchain)" = 'leanprover/lean4:v4.33.0-rc1'

      - name: Resolve source root after pinned checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source producer/sources/annals-challenge-marton.json \
            --runner producer/runner.json \
            --checkout-root "$GITHUB_WORKSPACE/_target/source" \
            --github-env "$GITHUB_ENV"

      - name: Install pinned Elan prerequisite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compute exact Mathlib lockfile cache key
        id: mathlib-cache-key
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ROOT/lean-toolchain"
          test -f "$SOURCE_ROOT/lake-manifest.json"
          lean_pin="$(sha256sum "$SOURCE_ROOT/lean-toolchain" | cut -d ' ' -f 1)"
          lake_pin="$(sha256sum "$SOURCE_ROOT/lake-manifest.json" | cut -d ' ' -f 1)"
          echo "key=mathlib-archives-v1-${RUNNER_OS}-${lean_pin}-${lake_pin}" >> "$GITHUB_OUTPUT"

      - name: Restore existing Mathlib download archives
        id: mathlib-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/mathlib
          key: ${{ steps.mathlib-cache-key.outputs.key }}

      - name: Restore pinned Mathlib dependencies once
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py run --cwd "$SOURCE_ROOT" -- lake exe cache get

      - name: Save bounded Mathlib archive downloads
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cache="$HOME/.cache/mathlib"
          if [ -d "$cache" ]; then
            size="$(du -sk "$cache" | awk '{print $1}')"
            printf 'mathlib_archives_kib=%s\n' "$size"
            if [ "$size" -gt 0 ] && [ "$size" -le 750000 ]; then
              echo 'save=true' >> "$GITHUB_OUTPUT"
            fi
          fi
        id: cache-size

      - name: Persist pinned Mathlib archive cache
        if: steps.mathlib-cache.outputs.cache-hit != 'true' && steps.cache-size.outputs.save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/mathlib
          key: ${{ steps.mathlib-cache-key.outputs.key }}

      - name: Compile only Marton module against restored dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py run --cwd "$SOURCE_ROOT" -- lake build "$BUILD_TARGET"

      - name: Capture actual Lean axiom stdout for exact theorem
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_ID" = annals-challenge-marton
          lean_version="$(cd "$SOURCE_ROOT" && lake env lean --version)"
          lean_binary="$(cd "$SOURCE_ROOT" && elan which lean)"
          test -x "$lean_binary"
          lean_binary_sha256="$(sha256sum "$lean_binary" | cut -d ' ' -f 1)"
          python3 scripts/marton_axiom_witness.py capture \
            --source-root "$SOURCE_ROOT" \
            --probe "$GITHUB_WORKSPACE/tests/fixtures/lean_axioms/MartonProbe.lean" \
            --out _witness/marton \
            --repository "$GITHUB_REPOSITORY" \
            --github-head "${{ github.sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --lean-version "$lean_version" \
            --lean-executable-sha256 "$lean_binary_sha256"

      - name: Upload bounded Marton axiom witness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marton-axiom-witness
          path: _witness/marton/
          if-no-files-found: warn
          retention-days: 30
