name: Lean direct module reader

on:
  pull_request:
    paths:
      - 'producer/lean/ReadModuleFacts.lean'
      - 'producer/lean/ReadDependencyNames.lean'
      - 'producer/runner.json'
      - 'producer/pilots/riemann-hypothesis-full.json'
      - 'scripts/load_producer_env.py'
      - 'src/theseus_repo_search/producer_config.py'
      - 'tools/dev/check-direct-module-reader'
      - 'tools/dev/check-closed-module-replay'
      - 'scripts/direct_module_replay.py'
      - 'scripts/riemann_semantic_plugin_pilot.py'
      - 'scripts/adapt_leandepviz_lean436.py'
      - 'src/theseus_repo_search/normalize.py'
      - 'tests/test_direct_module_replay.py'
      - 'tests/test_direct_module_reader_workflow.py'
      - '.github/workflows/lean-direct-module-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout Repository Search
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load existing producer pins
        run: |
          python3 scripts/load_producer_env.py \
            --source producer/pilots/riemann-hypothesis-full.json \
            --runner producer/runner.json \
            --github-env "$GITHUB_ENV"

      - name: Install exact pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/rh-lean-toolchain" \
            "https://raw.githubusercontent.com/${SOURCE_REPO}/${SOURCE_COMMIT}/lean-toolchain"
          toolchain="$(tr -d '\r\n' < "$RUNNER_TEMP/rh-lean-toolchain")"
          test "$toolchain" = 'leanprover/lean4:v4.36.0'
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          lean="$(ELAN_TOOLCHAIN="$toolchain" "$HOME/.elan/bin/elan" which lean)"
          printf 'LEAN_BIN_DIR=%s\n' "$(dirname "$lean")" >> "$GITHUB_ENV"

      - name: Verify native reader on isolated and split modules
        run: tools/dev/check-direct-module-reader

      - name: Compare complete small import closure with pinned LeanDepViz
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/${EXTRACTOR_REPO}/${EXTRACTOR_COMMIT}/LeanDepViz/Main.lean"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/LeanDepVizMain.upstream.lean" "$url"
          echo "${EXTRACTOR_MAIN_SHA256}  $RUNNER_TEMP/LeanDepVizMain.upstream.lean" | sha256sum --check
          python3 scripts/adapt_leandepviz_lean436.py \
            --input "$RUNNER_TEMP/LeanDepVizMain.upstream.lean" \
            --output "$RUNNER_TEMP/LeanDepVizMain.lean"
          EXTRACTOR_MAIN="$RUNNER_TEMP/LeanDepVizMain.lean" tools/dev/check-closed-module-replay
