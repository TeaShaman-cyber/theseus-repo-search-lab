name: Heavy PostgreSQL contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repo_search_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d repo_search_contract"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Run repository Heavy PostgreSQL endpoint
        run: |
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=postgres \
            -e PGPASSWORD=postgres \
            -e PGDATABASE=repo_search_contract \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            postgres:17 \
            sh -c 'tools/ci/heavy-postgres'
