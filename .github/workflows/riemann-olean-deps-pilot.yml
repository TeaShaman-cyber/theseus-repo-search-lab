name: Riemann upstream olean deps pilot

on:
  pull_request:
    paths:
      - '.github/workflows/riemann-olean-deps-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riemann-olean-deps-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      SOURCE_DESCRIPTOR: producer/pilots/riemann-hypothesis-full.json
      PILOT_MODULE_A: CompanionTheory.AutomorphicTheory.BesselWaveGrids.InterlacingGrids.PairOKOfInterlace
      PILOT_MODULE_B: Lemmata.GeneralBFactSecondVersion.Imports

    steps:
      - name: Checkout Repository Search
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load pinned producer configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "$SOURCE_DESCRIPTOR" \
            --runner producer/runner.json \
            --github-env "$GITHUB_ENV"

      - name: Checkout exact RH source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py checkout \
            --repo-url "https://github.com/${SOURCE_REPO}.git" \
            --commit "$SOURCE_COMMIT" \
            --dest _target/source
          python3 scripts/producer_guard.py verify \
            --repo-dir _target/source \
            --expected "$SOURCE_COMMIT"

      - name: Resolve source root
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "$SOURCE_DESCRIPTOR" \
            --runner producer/runner.json \
            --checkout-root "$GITHUB_WORKSPACE/_target/source" \
            --github-env "$GITHUB_ENV"

      - name: Install pinned runner and adapted extractor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto "=https" --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

          url="https://raw.githubusercontent.com/${EXTRACTOR_REPO}/${EXTRACTOR_COMMIT}/LeanDepViz/Main.lean"
          curl --fail --location --proto "=https" --tlsv1.2 \
            --output "$RUNNER_TEMP/LeanDepVizMain.upstream.lean" "$url"
          echo "${EXTRACTOR_MAIN_SHA256}  $RUNNER_TEMP/LeanDepVizMain.upstream.lean" | sha256sum --check
          python3 scripts/adapt_leandepviz_lean436.py \
            --input "$RUNNER_TEMP/LeanDepVizMain.upstream.lean" \
            --output "$RUNNER_TEMP/LeanDepVizMain.lean"
          adapted_sha="$(sha256sum "$RUNNER_TEMP/LeanDepVizMain.lean" | cut -d ' ' -f 1)"
          printf 'ADAPTED_EXTRACTOR_SHA256=%s\n' "$adapted_sha" >> "$GITHUB_ENV"

      - name: Build pinned upstream olean-export with its locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py checkout \
            --repo-url https://github.com/sdiehl/olean-export.git \
            --commit 8318f1d4e4fc5b530d34ff1ee3d73321587565b9 \
            --dest _target/olean-export
          rustup toolchain install 1.100.0 --profile minimal
          (cd _target/olean-export; cargo +1.100.0 build --locked --release --bin olean-export)
          _target/olean-export/target/release/olean-export --version
          _target/olean-export/target/release/olean-export deps --help

      - name: Restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          MATHLIB_CACHE_GET_URL=https://cache.mathlib.org/mathlib4 \
            python3 scripts/producer_guard.py run --cwd "$SOURCE_ROOT" -- \
              lake exe mathlib/cache get

      - name: Verify dependency inputs and restore only two terminal RH modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _out
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C "$SOURCE_ROOT" diff --exit-code
          test "$(cat "$SOURCE_ROOT/lean-toolchain")" = 'leanprover/lean4:v4.36.0'
          (cd "$SOURCE_ROOT"; lean --version) | tee _out/lean-version.txt
          grep -F 'commit 611c117bfaf7b7ae1cfcf246ce6fba31e8f509e9' _out/lean-version.txt
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['SOURCE_ROOT'])
          manifest = json.loads((root/'lake-manifest.json').read_text())
          for package in manifest['packages']:
              path = root/'.lake/packages'/package['name']
              assert subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip() == package['rev']
              subprocess.run(['git','-C',str(path),'diff','--exit-code','HEAD'],check=True)
          Path('_out/dependency-manifest.json').write_bytes((root/'lake-manifest.json').read_bytes())
          PY
          printf '%s\n' "$PILOT_MODULE_A" "$PILOT_MODULE_B" > _out/modules.txt
          /usr/bin/time -f 'wall_s=%e peak_kib=%M' -o _out/rh-restore-time.txt \
            python3 scripts/restore_riemann_ci_cache_subset.py --project "$SOURCE_ROOT" \
              --modules-file _out/modules.txt --metrics-out _out/restore-receipt.json

      - name: Run upstream graph reader directly on actual RH and standard library
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          bin="$root/_target/olean-export/target/release"
          cd "$SOURCE_ROOT"
          /usr/bin/time -f 'wall_s=%e peak_kib=%M' -o "$root/_out/rh-deps-time.txt" \
            lake env "$bin/olean-export" deps "$PILOT_MODULE_A" "$PILOT_MODULE_B" \
              --trust Init,Std,Lean,Mathlib,Batteries,Aesop,Qq,ProofWidgets,ImportGraph,LeanSearchClient,Plausible \
              -o "$root/_out/rh-deps.jsonl"
          /usr/bin/time -f 'wall_s=%e peak_kib=%M' -o "$root/_out/nat-deps-time.txt" \
            lake env "$bin/olean-export" deps Init.Data.Nat.Basic -o "$root/_out/nat-deps.jsonl"
          sha256sum "$bin/olean-export" > "$root/_out/upstream-binary.sha256"
          lean_bin="$(elan which lean)"
          for module in "$PILOT_MODULE_A" "$PILOT_MODULE_B"; do
            path="$SOURCE_ROOT/.lake/build/lib/lean/${module//./\/}.olean"
            env -u LEAN_PATH "$lean_bin" --run "$root/producer/lean/ReadModuleFacts.lean" \
              "$module" "$path" --metadata "$root/_out/$module.json" > "$root/_out/$module.jsonl"
          done

      - name: Measure parity against native facts without reconstructing the graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, hashlib, json, os, subprocess
          from pathlib import Path
          out = Path('_out')
          roots = [os.environ['PILOT_MODULE_A'], os.environ['PILOT_MODULE_B']]
          rows = [json.loads(line) for line in (out/'rh-deps.jsonl').read_text().splitlines()]
          results = []
          for module in roots:
              expected = {r['full_name']: set(r['type_dependencies']) | set(r['value_dependencies'])
                          for r in map(json.loads, (out/(module+'.jsonl')).read_text().splitlines())}
              actual_rows = [r for r in rows if r['module'] == module]
              actual = {r['name']: set(r['uses']) for r in actual_rows}
              assert len(actual) == len(actual_rows) and actual, 'missing or duplicate module rows'
              shared = actual.keys() & expected.keys()
              missing = sorted((n, d) for n in shared for d in expected[n] - actual[n])
              extra = sorted((n, d) for n in shared for d in actual[n] - expected[n])
              results.append({'module': module, 'native_visible': len(expected), 'upstream_rows': len(actual),
                              'shared_names': len(shared), 'missing_names': sorted(expected.keys()-actual.keys()),
                              'extra_names': sorted(actual.keys()-expected.keys()),
                              'missing_edges': missing, 'extra_edges': extra})
          nat = [json.loads(line) for line in (out/'nat-deps.jsonl').read_text().splitlines()]
          assert len({r['module'] for r in nat}) >= 13 and nat
          receipt = {'schema':'theseus.olean-deps-pilot.v1',
                     'upstream_commit':'8318f1d4e4fc5b530d34ff1ee3d73321587565b9',
                     'source_commit':os.environ['SOURCE_COMMIT'],
                     'producer_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                     'rh_results':results, 'nat_modules':len({r['module'] for r in nat}),
                     'nat_rows':len(nat), 'nat_edges':sum(len(r['uses']) for r in nat),
                     'timings':{p.name:p.read_text().strip() for p in out.glob('*time.txt')},
                     'file_hashes':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,ensure_ascii=False))
          print('UPSTREAM_DEPS_COMPARISON_COMPLETED')
          PY

      - name: Upload comparison evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: riemann-olean-deps-pilot
          path: _out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove disposable workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _target _out
          test ! -e _target
          test ! -e _out
