name: Parallel accepted split preparation

on:
  push:
    branches: [research/parallel-split-215]
    paths:
      - .github/workflows/parallel-split-preparation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-split-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        source_id:
          - annals-challenge-full
          - annals-challenge-marton
          - decreasing-diagrams-complete
          - formal-conjectures-bsd
          - formal-conjectures-navier-stokes
          - formal-conjectures-p-vs-np
          - formal-conjectures-poincare-statement
          - formal-conjectures-rh-equivalents
          - formal-conjectures-riemann
          - formal-conjectures-zeta-moments
          - formal-conjectures-zeta-zeros
          - imperial-flt-partial
          - leanprover-community-con-nf
          - leanprover-community-flt-regular
          - openai-cdc-lean
          - openai-long-gaps
          - openai-prime-gaps-186
          - openai-ten-proofs-compactness-degeneracy
          - openai-ten-proofs-connes-rigidity
          - openai-ten-proofs-ehrhart
          - openai-ten-proofs-multicolor
          - openai-ten-proofs-non-sofic
          - openai-ten-proofs-permanent
          - openai-ten-proofs-sphere-packing
          - sphere-eversion-main
          - zeta23
    env:
      SOURCE_ID: ${{ matrix.source_id }}
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned native DuckDB CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/duckdb.zip" https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  $RUNNER_TEMP/duckdb.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb-bin"
          "$RUNNER_TEMP/duckdb-bin/duckdb" --version
      - name: Prepare verified split from accepted release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p _result
          python3 scripts/split_projection.py prepare-corpus --catalog producer/accepted-corpora.json --cache-dir "$RUNNER_TEMP/verified-corpus" --source-id "$SOURCE_ID" --duckdb "$RUNNER_TEMP/duckdb-bin/duckdb" > _result/prepare.json
          python3 - <<'PY_RESULT'
          import hashlib,json,os,shutil
          from pathlib import Path
          p=Path('_result')
          x=json.loads((p/'prepare.json').read_text())
          assert x['source_id']==os.environ['SOURCE_ID']
          source=Path(x['directory']).resolve()
          assert source.is_relative_to(Path(os.environ['RUNNER_TEMP']).resolve()/'verified-corpus'/'split-v1')
          names=['search.sqlite','nodes.csv','edges.csv','receipt.json','graph.duckdb']
          for n in names:
              f=source/n
              assert f.is_file() and not f.is_symlink()
              shutil.copyfile(f,p/n)
          def digest(f):
              with f.open('rb') as stream:
                  return hashlib.file_digest(stream,'sha256').hexdigest()
          record={'source_id':x['source_id'],'head':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'catalog_file_sha256':digest(Path('producer/accepted-corpora.json')),'split_projection_sha256':x['split_projection_sha256'],'files':{n:digest(p/n) for n in names+['prepare.json']}}
          (p/'manifest.json').write_text(json.dumps(record,sort_keys=True)+'\n')
          print('PARALLEL_SPLIT_PREPARE_PASS',json.dumps(record))
          PY_RESULT
      - name: Upload verified candidate, no cloud credentials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: split-prepared-${{ matrix.source_id }}
          path: _result/
          retention-days: 3
          if-no-files-found: error
