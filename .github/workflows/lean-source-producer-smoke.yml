name: Lean source repository lens producer smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-source-repo-lens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - source_descriptor: producer/sources/leanprover-community-riemann-readable.json
            replay_script: scripts/replay_queued_intake.py
            artifact_name: leanprover-community-riemann-readable-adapted-repo-index-v1
    steps:
      - name: Checkout repository lens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Load producer configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --github-env "$GITHUB_ENV"

      - name: Checkout pinned source
        if: matrix.source_kind != 'archive'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py checkout \
            --repo-url "https://github.com/${SOURCE_REPO}.git" \
            --commit "$SOURCE_COMMIT" \
            --dest _target/source

      - name: Materialize pinned archive source
        if: matrix.source_kind == 'archive'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _out
          python3 scripts/materialize_archive_source.py \
            --source "${{ matrix.source_descriptor }}" \
            --dest _target/source \
            --receipt _out/source-materialization.json

      - name: Verify exact source readback
        if: matrix.source_kind != 'archive'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py verify \
            --repo-dir _target/source \
            --expected "$SOURCE_COMMIT"
          printf "source_readback=%s\n" "$(git -C _target/source rev-parse HEAD)"

      - name: Verify archive materialization readback
        if: matrix.source_kind == 'archive'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ matrix.source_descriptor }}" \
            "$GITHUB_WORKSPACE/_target/source" \
            "$GITHUB_WORKSPACE/_out/source-materialization.json" <<'PY_ARCHIVE_READBACK'
          import sys
          from pathlib import Path

          from scripts.materialize_archive_source import verify_materialized_archive_members
          from theseus_repo_search.producer_config import load_lean_archive_source

          descriptor = Path(sys.argv[1])
          materialization_root = Path(sys.argv[2])
          receipt = Path(sys.argv[3])
          source = load_lean_archive_source(descriptor)
          members = verify_materialized_archive_members(
              source, dest=materialization_root, receipt_path=receipt
          )
          print(f"archive_member_count={len(members['members'])}")
          PY_ARCHIVE_READBACK

      - name: Resolve canonical source root
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --checkout-root "$GITHUB_WORKSPACE/_target/source" \
            --github-env "$GITHUB_ENV"

      - name: Observe source-owned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_ROOT"
          observed="$(python3 scripts/producer_guard.py toolchain --cwd "$GITHUB_WORKSPACE/_target/source")"
          test "$observed" = leanprover/lean4:v4.37.0-rc1
          printf 'PROJECT_ROOT=%s\n' "$GITHUB_WORKSPACE/_target/source" >> "$GITHUB_ENV"
          test -n "$observed"
          printf "observed_lean_toolchain=%s\n" "$observed"

      - name: Install pinned generic runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto "=https" --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          url="https://raw.githubusercontent.com/cameronfreer/LeanDepViz/7859d91f89b37c9193d9a09709a58be6d98f94d6/LeanDepViz/Main.lean"
          curl --fail --location --proto "=https" --tlsv1.2 \
            --output "$RUNNER_TEMP/LeanDepVizMain.upstream.lean" "$url"
          git show "$EXTRACTOR_COMMIT:scripts/adapt_leandepviz_lean436.py" > "$RUNNER_TEMP/adapt-extractor.py"
          cmp "$RUNNER_TEMP/adapt-extractor.py" scripts/adapt_leandepviz_lean436.py
          python3 "$RUNNER_TEMP/adapt-extractor.py" --input "$RUNNER_TEMP/LeanDepVizMain.upstream.lean" --output "$RUNNER_TEMP/LeanDepVizMain.lean"
          echo "${EXTRACTOR_MAIN_SHA256}  $RUNNER_TEMP/LeanDepVizMain.lean" | sha256sum --check

      - name: Restore exact licensed upstream cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _out
          cd "$PROJECT_ROOT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          /usr/bin/time -v lake exe cache get
          lake build --no-build
          git diff --exit-code HEAD
          df -h .
          lean --version

      - name: Plan and extract one coherent Lean environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _out/shards
          free -h
          python3 scripts/plan_lean_shards.py --repo-root "$PROJECT_ROOT" --source-prefix src --shard-count 1 --out _out/shard-plan.json
          python3 - <<'PY_PLAN'
          import json
          from pathlib import Path
          plan=json.loads(Path('_out/shard-plan.json').read_text())
          assert plan['module_count']==802
          assert plan['shard_count']==1
          modules=[m for s in plan['shards'] for m in s['modules']]
          assert len(set(modules))==802
          for shard in plan['shards']:
              p=Path('_out/shards')/('shard-%03d'%shard['index'])
              p.mkdir()
              (p/'roots.txt').write_text('\n'.join(shard['modules'])+'\n')
          PY_PLAN
          for dir in _out/shards/shard-*; do
            mapfile -t modules < "$dir/roots.txt"
            args=()
            for module in "${modules[@]}"; do args+=(--root-module "$module"); done
            csv=$(IFS=,; echo "${modules[*]}")
            /usr/bin/time -v python3 scripts/producer_guard.py extract \
              --cwd "$PROJECT_ROOT" --repo-dir "$PROJECT_ROOT" --expected "$SOURCE_COMMIT" \
              --source-repo "$SOURCE_REPO" --source-subdir "$SOURCE_SUBDIR" "${args[@]}" \
              --raw-depgraph "$GITHUB_WORKSPACE/$dir/raw-depgraph.json" \
              --receipt "$GITHUB_WORKSPACE/$dir/raw-depgraph-receipt.json" \
              --producer-kind lean-dep-viz --producer-tool-repo "$EXTRACTOR_REPO" \
              --producer-tool-commit "$EXTRACTOR_COMMIT" --producer-tool-hash "$EXTRACTOR_MAIN_SHA256" -- \
              lake env lean --run "$RUNNER_TEMP/LeanDepVizMain.lean" --roots "$csv" \
              --include-prefix "$ROOT_MODULES_CSV" --json-out "$GITHUB_WORKSPACE/$dir/raw-depgraph.json"
          done
          # Refuse ambiguous module ownership rather than canonicalizing a conflict.
          python3 - <<'PY_MERGE'
          import json
          from pathlib import Path
          owners={}
          for p in sorted(Path('_out/shards').glob('shard-*/raw-depgraph.json')):
              for row in json.loads(p.read_text())['nodes']:
                  name=row['fullName']
                  module=row['module']
                  assert owners.setdefault(name,module)==module,(name,module,owners[name])
          print('SHARD_OWNERSHIP_PASS',len(owners))
          PY_MERGE
          python3 scripts/merge_raw_depgraph_shards.py --input-root _out/shards \
            --source-repo "$SOURCE_REPO" --source-commit "$SOURCE_COMMIT" --source-subdir "$SOURCE_SUBDIR" \
            --scope-root-module Lib --scope-root-module Main --scope-root-module New --scope-root-module Statements \
            --producer-kind lean-dep-viz --producer-tool-repo "$EXTRACTOR_REPO" \
            --producer-tool-commit "$EXTRACTOR_COMMIT" --producer-tool-hash "$EXTRACTOR_MAIN_SHA256" \
            --out-raw _out/raw-depgraph.json --out-receipt _out/raw-depgraph-receipt.json

      - name: Install repository lens package
        run: python3 -m pip install -e .

      - name: Build normalized artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m theseus_repo_search build-source-artifact \
            --source "${{ matrix.source_descriptor }}" \
            --source-root "$SOURCE_ROOT" \
            --source-container "$GITHUB_WORKSPACE/_target/source" \
            --materialization-receipt "$GITHUB_WORKSPACE/_out/source-materialization.json" \
            --member-manifest "$GITHUB_WORKSPACE/_out/source-materialization.members.json" \
            --raw-depgraph _out/raw-depgraph.json \
            --raw-depgraph-receipt _out/raw-depgraph-receipt.json \
            --producer-kind lean-dep-viz \
            --producer-tool-repo "$EXTRACTOR_REPO" \
            --producer-tool-commit "$EXTRACTOR_COMMIT" \
            --producer-tool-hash "$EXTRACTOR_MAIN_SHA256" \
            --out "_out/${SOURCE_ID}-artifact"
          test -s "_out/${SOURCE_ID}-artifact/authority-receipt.json"

      - name: Verify project and replay selected source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m theseus_repo_search verify-artifact --artifact "_out/${SOURCE_ID}-artifact"
          python3 -m theseus_repo_search build-index \
            --artifact "_out/${SOURCE_ID}-artifact" \
            --db "_out/${SOURCE_ID}.sqlite"
          python3 "${{ matrix.replay_script }}" \
            --db "_out/${SOURCE_ID}.sqlite" \
            --source-root "$SOURCE_ROOT" \
            --artifact "_out/${SOURCE_ID}-artifact" \
            --descriptor "${{ matrix.source_descriptor }}" \
            --out "_out/${SOURCE_ID}-replay.json"

      - name: Retain failed replay diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostic-${{ matrix.artifact_name }}
          path: |
            _out/*-artifact/
            _out/raw-depgraph.json
            _out/raw-depgraph-receipt.json
            _out/shard-plan.json
            _out/shards/
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove disposable producer outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f _out/raw-depgraph.json "_out/${SOURCE_ID}.sqlite" _out/raw-depgraph-receipt.json \
            _out/source-materialization.json _out/source-materialization.members.json
          test ! -e _out/raw-depgraph.json
          test ! -e "_out/${SOURCE_ID}.sqlite"
          test ! -e _out/raw-depgraph-receipt.json
          test -s "_out/${SOURCE_ID}-artifact/authority-receipt.json"

      - name: Upload normalized repository lens artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            _out/*-artifact/
            _out/*-replay.json
          if-no-files-found: error
          retention-days: 7

  consume-artifact:
    needs: produce-and-replay
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - source_descriptor: producer/sources/leanprover-community-riemann-readable.json
            replay_script: scripts/replay_queued_intake.py
            artifact_name: leanprover-community-riemann-readable-adapted-repo-index-v1
    steps:
      - name: Checkout repository lens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load registered source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --github-env "$GITHUB_ENV"

      - name: Download normalized repository lens artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.artifact_name }}
          path: _consumer/download

      - name: Install repository lens package
        run: python3 -m pip install -e .

      - name: Verify artifact and build disposable projection
        shell: bash
        run: |
          set -euo pipefail
          artifact="_consumer/download/${SOURCE_ID}-artifact"
          db="_consumer/${SOURCE_ID}.sqlite"
          test -d "$artifact"
          python3 -m theseus_repo_search verify-artifact --artifact "$artifact"
          python3 -m theseus_repo_search build-index --artifact "$artifact" --db "$db"
          python3 - "$db" <<'PY_SQLITE'
          import sqlite3
          import sys

          with sqlite3.connect(sys.argv[1]) as conn:
              observed = conn.execute("PRAGMA quick_check").fetchone()[0]
          if observed != "ok":
              raise SystemExit(f"SQLite quick_check failed: {observed}")
          print(f"sqlite_quick_check={observed}")
          PY_SQLITE

      - name: Replay artifact without source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ matrix.replay_script }}" \
            --db "_consumer/${SOURCE_ID}.sqlite" \
            --artifact "_consumer/download/${SOURCE_ID}-artifact" \
            --descriptor "${{ matrix.source_descriptor }}" \
            --out "_consumer/${SOURCE_ID}-replay.json"

      - name: Write consumer acceptance receipt
        env:
          RECEIPT_WORKFLOW_REF: ${{ github.workflow_ref }}
          RECEIPT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/write_consumer_receipt.py \
            --artifact "_consumer/download/${SOURCE_ID}-artifact" \
            --db "_consumer/${SOURCE_ID}.sqlite" \
            --replay "_consumer/${SOURCE_ID}-replay.json" \
            --source-descriptor "${{ matrix.source_descriptor }}" \
            --source-descriptor-path "${{ matrix.source_descriptor }}" \
            --runner-config producer/runner.json \
            --runner-config-path producer/runner.json \
            --artifact-name "${{ matrix.artifact_name }}" \
            --repository-head "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --workflow-ref "$RECEIPT_WORKFLOW_REF" \
            --workflow-sha "$RECEIPT_WORKFLOW_SHA" \
            --out "_consumer/${SOURCE_ID}-consumer-receipt.json"

      - name: Upload consumer acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}-consumer-receipt
          path: _consumer/*-consumer-receipt.json
          if-no-files-found: error
          retention-days: 7
