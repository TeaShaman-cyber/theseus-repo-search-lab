name: Lean source producer smoke
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  consume-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - source_descriptor: producer/sources/annals-challenge-full.json
            replay_script: scripts/replay_queued_intake.py
            artifact_name: annals-challenge-full-repo-index-v1
          - source_descriptor: producer/sources/formal-conjectures-riemann.json
            replay_script: scripts/replay_queued_intake.py
            artifact_name: formal-conjectures-riemann-repo-index-v1
          - source_descriptor: producer/sources/openai-euler.json
            replay_script: scripts/replay_queued_intake.py
            artifact_name: openai-euler-repo-index-v1
          - source_descriptor: producer/sources/openai-ten-proofs-sphere-packing.json
            replay_script: scripts/replay_queued_intake.py
            artifact_name: openai-ten-proofs-sphere-packing-repo-index-v1
          - source_descriptor: producer/sources/openai-ten-proofs-permanent.json
            replay_script: scripts/replay_queued_intake.py
            artifact_name: openai-ten-proofs-permanent-repo-index-v1
    steps:
      - name: Checkout repository lens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load registered source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --github-env "$GITHUB_ENV"

      - name: Verify original producer run and selected artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          repo=TeaShaman-cyber/theseus-repo-search-lab
          gh api "repos/$repo/actions/runs/45892943425" --jq .head_sha | grep -Fx d82b675efe9a8a6f96ab2e6b2b7b53d7f3e928ae
          gh api "repos/$repo/actions/runs/45892943425/jobs?per_page=100" > "$RUNNER_TEMP/origin-jobs.json"
          gh api "repos/$repo/actions/runs/45892943425/artifacts?per_page=100" > "$RUNNER_TEMP/origin-artifacts.json"
          python3 - <<'PY_ORIGIN'
          import json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])
          name=os.environ["ARTIFACT_NAME"]
          source=name.removesuffix("-repo-index-v1")
          jobs=[x for x in json.loads((d/"origin-jobs.json").read_text())["jobs"]
                if x["name"].startswith("produce-and-replay (producer/sources/"+source+".json,")]
          assert len(jobs)==1 and jobs[0]["conclusion"]=="success"
          artifacts=[x for x in json.loads((d/"origin-artifacts.json").read_text())["artifacts"]
                     if x["name"]==name and not x["expired"]]
          assert len(artifacts)==1 and artifacts[0]["digest"].startswith("sha256:")
          print("ORIGIN",jobs[0]["id"],artifacts[0]["id"],artifacts[0]["digest"])
          PY_ORIGIN

      - name: Download normalized repository lens artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.artifact_name }}
          path: _consumer/download
          run-id: 45892943425
          repository: TeaShaman-cyber/theseus-repo-search-lab
          github-token: ${{ github.token }}

      - name: Install repository lens package
        run: python3 -m pip install -e .

      - name: Verify artifact and build disposable projection
        shell: bash
        run: |
          set -euo pipefail
          artifact="_consumer/download/${SOURCE_ID}-artifact"
          db="_consumer/${SOURCE_ID}.sqlite"
          test -d "$artifact"
          python3 -m theseus_repo_search verify-artifact --artifact "$artifact"
          python3 -m theseus_repo_search build-index --artifact "$artifact" --db "$db"
          python3 - "$db" <<'PY_SQLITE'
          import sqlite3
          import sys

          with sqlite3.connect(sys.argv[1]) as conn:
              observed = conn.execute("PRAGMA quick_check").fetchone()[0]
          if observed != "ok":
              raise SystemExit(f"SQLite quick_check failed: {observed}")
          print(f"sqlite_quick_check={observed}")
          PY_SQLITE

      - name: Replay artifact without source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ matrix.replay_script }}" \
            --db "_consumer/${SOURCE_ID}.sqlite" \
            --artifact "_consumer/download/${SOURCE_ID}-artifact" \
            --descriptor "${{ matrix.source_descriptor }}" \
            --out "_consumer/${SOURCE_ID}-replay.json"

      - name: Write consumer acceptance receipt
        env:
          RECEIPT_WORKFLOW_REF: ${{ github.workflow_ref }}
          RECEIPT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/write_consumer_receipt.py \
            --artifact "_consumer/download/${SOURCE_ID}-artifact" \
            --db "_consumer/${SOURCE_ID}.sqlite" \
            --replay "_consumer/${SOURCE_ID}-replay.json" \
            --source-descriptor "${{ matrix.source_descriptor }}" \
            --source-descriptor-path "${{ matrix.source_descriptor }}" \
            --runner-config producer/runner.json \
            --runner-config-path producer/runner.json \
            --artifact-name "${{ matrix.artifact_name }}" \
            --repository-head "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --workflow-ref "$RECEIPT_WORKFLOW_REF" \
            --workflow-sha "$RECEIPT_WORKFLOW_SHA" \
            --out "_consumer/${SOURCE_ID}-consumer-receipt.json"

      - name: Upload consumer acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}-consumer-receipt
          path: _consumer/*-consumer-receipt.json
          if-no-files-found: error
          retention-days: 7
