        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/mathlib
          key: ${{ steps.mathlib-cache-key.outputs.key }}

      - name: Restore preceding exact build checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: poincare-build-stage-1
          path: _checkpoint

      - name: Verify and restore build state
        shell: bash
        run: |
          set -euo pipefail
          (cd _checkpoint && sha256sum --check SHA256SUMS)
          python3 - <<'PY_STATE'
          import json, os, hashlib
          from pathlib import Path
          p=Path(os.environ['SOURCE_ROOT'])
          x=json.loads(Path('_checkpoint/state.json').read_text())
          assert x==dict(source=os.environ['SOURCE_COMMIT'],head=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],stage=1,toolchain=(p/'lean-toolchain').read_text(),manifest=hashlib.sha256((p/'lake-manifest.json').read_bytes()).hexdigest())
          PY_STATE
          test ! -e "$SOURCE_ROOT/.lake/build"
          tar --zstd -xf _checkpoint/build.tar.zst -C "$SOURCE_ROOT/.lake"
          test -d "$SOURCE_ROOT/.lake/build/lib/lean"
          rm -rf _checkpoint
          printf 'CHECKPOINT_RESTORED stage=1\n'

      - name: Compile bounded time slice and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
