name: Lean source repository lens producer smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-source-repo-lens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_descriptor: producer/sources/zeta23.json
            replay_script: scripts/replay_zeta23.py
            artifact_name: zeta23-repo-index-v1
          - source_descriptor: producer/sources/openai-long-gaps.json
            replay_script: scripts/replay_long_gaps.py
            artifact_name: openai-long-gaps-repo-index-v1
          - source_descriptor: producer/sources/leanprover-community-flt-regular.json
            replay_script: scripts/replay_flt_regular.py
            artifact_name: leanprover-community-flt-regular-repo-index-v1
          - source_descriptor: producer/sources/openai-cdc-lean.json
            replay_script: scripts/replay_cdc_lean.py
            artifact_name: openai-cdc-lean-repo-index-v1
          - source_descriptor: producer/sources/leanprover-community-con-nf.json
            replay_script: scripts/replay_con_nf.py
            artifact_name: leanprover-community-con-nf-repo-index-v1
          - source_descriptor: producer/sources/openai-ten-proofs-multicolor.json
            replay_script: scripts/replay_ten_proofs_multicolor.py
            artifact_name: openai-ten-proofs-multicolor-repo-index-v1
    steps:
      - name: Checkout repository lens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load producer configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --github-env "$GITHUB_ENV"

      - name: Checkout pinned source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py checkout \
            --repo-url "https://github.com/${SOURCE_REPO}.git" \
            --commit "$SOURCE_COMMIT" \
            --dest _target/source

      - name: Verify exact source readback
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py verify \
            --repo-dir _target/source \
            --expected "$SOURCE_COMMIT"
          printf "source_readback=%s\n" "$(git -C _target/source rev-parse HEAD)"

      - name: Resolve canonical source root
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --checkout-root "$GITHUB_WORKSPACE/_target/source" \
            --github-env "$GITHUB_ENV"

      - name: Observe source-owned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_ROOT"
          observed="$(python3 scripts/producer_guard.py toolchain --cwd "$SOURCE_ROOT")"
          test -n "$observed"
          printf "observed_lean_toolchain=%s\n" "$observed"

      - name: Install pinned generic runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto "=https" --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          url="https://raw.githubusercontent.com/${EXTRACTOR_REPO}/${EXTRACTOR_COMMIT}/LeanDepViz/Main.lean"
          curl --fail --location --proto "=https" --tlsv1.2 \
            --output "$RUNNER_TEMP/LeanDepVizMain.lean" "$url"
          echo "${EXTRACTOR_MAIN_SHA256}  $RUNNER_TEMP/LeanDepVizMain.lean" | sha256sum --check

      - name: Restore source dependency cache
        shell: bash
        run: |
          set -euo pipefail
          command -v lake
          started="$(date +%s)"
          python3 scripts/producer_guard.py run --cwd "$SOURCE_ROOT" -- lake exe cache get
          finished="$(date +%s)"
          printf "cache_get_seconds=%s\n" "$((finished - started))"
          cache_dir="${MATHLIB_CACHE_DIR:-$HOME/.cache/mathlib}"
          if [ -d "$cache_dir" ]; then
            printf "mathlib_cache_files=%s\n" "$(find "$cache_dir" -type f | wc -l | tr -d ' ')"
            printf "mathlib_cache_kib=%s\n" "$(du -sk "$cache_dir" | awk '{print $1}')"
          else
            printf "mathlib_cache_files=0\n"
            printf "mathlib_cache_kib=0\n"
          fi
          if [ -d "$SOURCE_ROOT/.lake/packages" ]; then
            printf "source_packages_kib=%s\n" "$(du -sk "$SOURCE_ROOT/.lake/packages" | awk '{print $1}')"
          else
            printf "source_packages_kib=0\n"
          fi

      - name: Build source target
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"

          heartbeat() {
            local started_epoch="$1"
            local tick=0
            while true; do
              sleep 60
              tick=$((tick + 1))
              now="$(date +%s)"
              elapsed="$((now - started_epoch))"
              ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              mem_available_kib="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
              root_free_kib="$(df -Pk / | awk 'NR == 2 {print $4}')"
              printf 'build_heartbeat ts=%s elapsed_seconds=%s source_id=%s build_target=%s mem_available_kib=%s root_free_kib=%s\n' \
                "$ts" "$elapsed" "$SOURCE_ID" "$BUILD_TARGET" "$mem_available_kib" "$root_free_kib"
              if (( tick % 5 == 0 )); then
                if [ -d "$SOURCE_ROOT/.lake/build" ]; then
                  source_build_kib="$(du -sk "$SOURCE_ROOT/.lake/build" | awk '{print $1}')"
                else
                  source_build_kib=0
                fi
                printf 'build_heartbeat_slow ts=%s elapsed_seconds=%s source_build_kib=%s\n' \
                  "$ts" "$elapsed" "$source_build_kib"
              fi
            done
          }

          heartbeat "$started" &
          heartbeat_pid=$!
          cleanup_heartbeat() {
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
          }
          trap cleanup_heartbeat EXIT
          trap 'cleanup_heartbeat; exit 130' INT
          trap 'cleanup_heartbeat; exit 143' TERM

          python3 scripts/producer_guard.py run --cwd "$SOURCE_ROOT" -- lake build "$BUILD_TARGET"

          cleanup_heartbeat
          trap - EXIT INT TERM
          finished="$(date +%s)"
          printf "source_build_seconds=%s\n" "$((finished - started))"
          if [ -d "$SOURCE_ROOT/.lake/build" ]; then
            printf "source_build_kib=%s\n" "$(du -sk "$SOURCE_ROOT/.lake/build" | awk '{print $1}')"
          else
            printf "source_build_kib=0\n"
          fi

      - name: Extract exact declaration graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _out
          root_args=()
          IFS="," read -r -a roots <<< "$ROOT_MODULES_CSV"
          for root in "${roots[@]}"; do
            root_args+=(--root-module "$root")
          done
          python3 scripts/producer_guard.py extract \
            --cwd "$SOURCE_ROOT" \
            --repo-dir "$GITHUB_WORKSPACE/_target/source" \
            --expected "$SOURCE_COMMIT" \
            --raw-depgraph "$GITHUB_WORKSPACE/_out/raw-depgraph.json" \
            --receipt "$GITHUB_WORKSPACE/_out/raw-depgraph-receipt.json" \
            --source-repo "$SOURCE_REPO" \
            --source-subdir "$SOURCE_SUBDIR" \
            "${root_args[@]}" \
            --producer-kind lean-dep-viz \
            --producer-tool-repo "$EXTRACTOR_REPO" \
            --producer-tool-commit "$EXTRACTOR_COMMIT" \
            --producer-tool-hash "$EXTRACTOR_MAIN_SHA256" -- \
            lake env lean --run "$RUNNER_TEMP/LeanDepVizMain.lean" \
            --roots "$ROOT_MODULES_CSV" \
            --json-out "$GITHUB_WORKSPACE/_out/raw-depgraph.json"

      - name: Install repository lens package
        run: python3 -m pip install -e .

      - name: Build normalized artifact
        shell: bash
        run: |
          set -euo pipefail
          root_args=()
          IFS="," read -r -a roots <<< "$ROOT_MODULES_CSV"
          for root in "${roots[@]}"; do
            root_args+=(--root-module "$root")
          done
          exclude_args=()
          if [ -n "$EXCLUDE_SOURCE_PREFIXES_CSV" ]; then
            IFS="," read -r -a excludes <<< "$EXCLUDE_SOURCE_PREFIXES_CSV"
            for prefix in "${excludes[@]}"; do
              exclude_args+=(--exclude-source-prefix "$prefix")
            done
          fi
          python3 -m theseus_repo_search build-artifact \
            --source-root "$SOURCE_ROOT" \
            --source-repo "$SOURCE_REPO" \
            --source-commit "$SOURCE_COMMIT" \
            --source-subdir "$SOURCE_SUBDIR" \
            "${root_args[@]}" \
            "${exclude_args[@]}" \
            --producer-kind lean-dep-viz \
            --producer-tool-repo "$EXTRACTOR_REPO" \
            --producer-tool-commit "$EXTRACTOR_COMMIT" \
            --producer-tool-hash "$EXTRACTOR_MAIN_SHA256" \
            --authoritative-readback \
            --raw-depgraph _out/raw-depgraph.json \
            --raw-depgraph-receipt _out/raw-depgraph-receipt.json \
            --out "_out/${SOURCE_ID}-artifact"
          test -s "_out/${SOURCE_ID}-artifact/authority-receipt.json"

      - name: Verify project and replay selected source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m theseus_repo_search verify-artifact --artifact "_out/${SOURCE_ID}-artifact"
          python3 -m theseus_repo_search build-index \
            --artifact "_out/${SOURCE_ID}-artifact" \
            --db "_out/${SOURCE_ID}.sqlite"
          python3 "${{ matrix.replay_script }}" \
            --db "_out/${SOURCE_ID}.sqlite" \
            --source-root "$SOURCE_ROOT" \
            --artifact "_out/${SOURCE_ID}-artifact" \
            --descriptor "${{ matrix.source_descriptor }}" \
            --out "_out/${SOURCE_ID}-replay.json"

      - name: Remove disposable producer outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f _out/raw-depgraph.json "_out/${SOURCE_ID}.sqlite" _out/raw-depgraph-receipt.json
          test ! -e _out/raw-depgraph.json
          test ! -e "_out/${SOURCE_ID}.sqlite"
          test ! -e _out/raw-depgraph-receipt.json
          test -s "_out/${SOURCE_ID}-artifact/authority-receipt.json"

      - name: Upload normalized repository lens artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            _out/*-artifact/
            _out/*-replay.json
          if-no-files-found: error
