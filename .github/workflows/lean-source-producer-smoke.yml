name: Lean source repository lens producer smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lean-source-repo-lens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - source_descriptor: producer/sources/openai-matrix-exponent.json
            replay_script: scripts/replay_queued_intake.py
            artifact_name: openai-matrix-exponent-recovery-repo-index-v1
    steps:
      - name: Checkout repository lens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Load producer configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --github-env "$GITHUB_ENV"

      - name: Checkout pinned source
        if: matrix.source_kind != 'archive'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py checkout \
            --repo-url "https://github.com/${SOURCE_REPO}.git" \
            --commit "$SOURCE_COMMIT" \
            --dest _target/source

      - name: Materialize pinned archive source
        if: matrix.source_kind == 'archive'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _out
          python3 scripts/materialize_archive_source.py \
            --source "${{ matrix.source_descriptor }}" \
            --dest _target/source \
            --receipt _out/source-materialization.json

      - name: Verify exact source readback
        if: matrix.source_kind != 'archive'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/producer_guard.py verify \
            --repo-dir _target/source \
            --expected "$SOURCE_COMMIT"
          printf "source_readback=%s\n" "$(git -C _target/source rev-parse HEAD)"

      - name: Verify archive materialization readback
        if: matrix.source_kind == 'archive'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ matrix.source_descriptor }}" \
            "$GITHUB_WORKSPACE/_target/source" \
            "$GITHUB_WORKSPACE/_out/source-materialization.json" <<'PY_ARCHIVE_READBACK'
          import sys
          from pathlib import Path

          from scripts.materialize_archive_source import verify_materialized_archive_members
          from theseus_repo_search.producer_config import load_lean_archive_source

          descriptor = Path(sys.argv[1])
          materialization_root = Path(sys.argv[2])
          receipt = Path(sys.argv[3])
          source = load_lean_archive_source(descriptor)
          members = verify_materialized_archive_members(
              source, dest=materialization_root, receipt_path=receipt
          )
          print(f"archive_member_count={len(members['members'])}")
          PY_ARCHIVE_READBACK

      - name: Resolve canonical source root
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --checkout-root "$GITHUB_WORKSPACE/_target/source" \
            --github-env "$GITHUB_ENV"

      - name: Observe source-owned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_ROOT"
          observed="$(python3 scripts/producer_guard.py toolchain --cwd "$SOURCE_ROOT")"
          test "$observed" = leanprover/lean4:v4.34.1
          test -n "$observed"
          printf "observed_lean_toolchain=%s\n" "$observed"

      - name: Recover exact successful Matrix extraction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=TeaShaman-cyber/theseus-repo-search-lab
          gh api "repos/$repo/actions/runs/45916405124" --jq .head_sha | grep -Fx 3862080dbb92befed2accffbab712ea06cc16a80
          gh api "repos/$repo/actions/jobs/140236584312" > "$RUNNER_TEMP/origin-job.json"
          gh api "repos/$repo/actions/artifacts/15163793834" > "$RUNNER_TEMP/origin-artifact.json"
          python3 - <<'PY_ORIGIN'
          import json, os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])
          j=json.loads((d/'origin-job.json').read_text())
          a=json.loads((d/'origin-artifact.json').read_text())
          assert j['run_id']==45916405124 and j['head_sha']=='3862080dbb92befed2accffbab712ea06cc16a80'
          for name in ('Build source target','Extract exact declaration graph','Checkpoint exact raw graph before normalization'):
              assert any(x['name']==name and x['conclusion']=='success' for x in j['steps'])
          assert a['workflow_run']['id']==45916405124 and a['id']==15163793834 and not a['expired']
          assert a['digest']=='sha256:fca18efbb1a9d7cbba63ae32966829914c6fd73d10490040861a38bec638524a'
          PY_ORIGIN
          mkdir -p _out
          gh api "repos/$repo/actions/artifacts/15163793834/zip" > "$RUNNER_TEMP/raw.zip"
          echo 'fca18efbb1a9d7cbba63ae32966829914c6fd73d10490040861a38bec638524a  '"$RUNNER_TEMP/raw.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/raw.zip" -d _out
          echo 'a3a0c0048317a151f5748501c187f126c6035ba0be91ff9220bc6a32f09dbbe3  _out/raw-depgraph.json' | sha256sum --check
          python3 - <<'PY_SCOPE'
          import json, os, subprocess
          from pathlib import Path
          from theseus_repo_search.sources import lean_module_source_path
          raw=json.loads(Path('_out/raw-depgraph.json').read_text())
          source=Path(os.environ['SOURCE_ROOT'])
          d=json.loads(Path('producer/sources/openai-matrix-exponent.json').read_text())
          paths=subprocess.check_output(['git','-C',str(source),'ls-files','-z','.']).decode().split('\0')
          paths={p for p in paths if p.endswith('.lean') and not p.startswith(tuple(d['exclude_source_prefixes']))}
          modules={lean_module_source_path(n['module']) for n in raw['nodes']}
          assert len(paths)==2966 and len(modules)==592 and modules<=paths
          print('RAW_SCOPE_PASS',len(paths),len(modules))
          PY_SCOPE

      - name: Install repository lens package
        run: python3 -m pip install -e .

      - name: Build normalized artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m theseus_repo_search build-source-artifact \
            --source "${{ matrix.source_descriptor }}" \
            --source-root "$SOURCE_ROOT" \
            --source-container "$GITHUB_WORKSPACE/_target/source" \
            --materialization-receipt "$GITHUB_WORKSPACE/_out/source-materialization.json" \
            --member-manifest "$GITHUB_WORKSPACE/_out/source-materialization.members.json" \
            --raw-depgraph _out/raw-depgraph.json \
            --raw-depgraph-receipt _out/raw-depgraph-receipt.json \
            --producer-kind lean-dep-viz \
            --producer-tool-repo "$EXTRACTOR_REPO" \
            --producer-tool-commit "$EXTRACTOR_COMMIT" \
            --producer-tool-hash "$EXTRACTOR_MAIN_SHA256" \
            --out "_out/${SOURCE_ID}-artifact"
          test -s "_out/${SOURCE_ID}-artifact/authority-receipt.json"
          python3 - <<'PY_PARITY'
          import hashlib
          from pathlib import Path
          p=Path('_out/openai-matrix-exponent-artifact')
          expected={'authority-receipt.json':'2b665fde34cf197171ee0cd9f124f772c8b0332077378e3d5aeaa05ef5d95ff5','edges.jsonl':'4ac3e8be5f0cd41ce04902d27315e8b2053713d222a8cb18d4918c1d68cf7f63','manifest.json':'485b91a64e1e4f10b0a3d770cd00f22c3701950993e2affd837fed180635fb43','nodes.jsonl':'52981dcbda43533e6a7f4382cff486bd1db0633657e4b6fc7caa70485279a427','raw-depgraph.json':'a3a0c0048317a151f5748501c187f126c6035ba0be91ff9220bc6a32f09dbbe3','sources.jsonl':'7d61b8635f8e029e000812ec938980cb067435a9f8bc90b755cedd5309126628'}
          for name, digest in expected.items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest, name
          print('CODESPACE_PARITY_PASS')
          PY_PARITY

      - name: Verify project and replay selected source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m theseus_repo_search verify-artifact --artifact "_out/${SOURCE_ID}-artifact"
          python3 -m theseus_repo_search build-index \
            --artifact "_out/${SOURCE_ID}-artifact" \
            --db "_out/${SOURCE_ID}.sqlite"
          python3 "${{ matrix.replay_script }}" \
            --db "_out/${SOURCE_ID}.sqlite" \
            --source-root "$SOURCE_ROOT" \
            --artifact "_out/${SOURCE_ID}-artifact" \
            --descriptor "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --out "_out/${SOURCE_ID}-replay.json"

      - name: Retain failed replay diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostic-${{ matrix.artifact_name }}
          path: |
            _out/*-artifact/
            _out/raw-depgraph.json
            _out/raw-depgraph-receipt.json
            _out/shard-plan.json
            _out/shards/
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove disposable producer outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f _out/raw-depgraph.json "_out/${SOURCE_ID}.sqlite" _out/raw-depgraph-receipt.json \
            _out/source-materialization.json _out/source-materialization.members.json
          test ! -e _out/raw-depgraph.json
          test ! -e "_out/${SOURCE_ID}.sqlite"
          test ! -e _out/raw-depgraph-receipt.json
          test -s "_out/${SOURCE_ID}-artifact/authority-receipt.json"

      - name: Upload normalized repository lens artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            _out/*-artifact/
            _out/*-replay.json
          if-no-files-found: error
          retention-days: 7

  consume-artifact:
    needs: produce-and-replay
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - source_descriptor: producer/sources/openai-matrix-exponent.json
            replay_script: scripts/replay_queued_intake.py
            artifact_name: openai-matrix-exponent-recovery-repo-index-v1
    steps:
      - name: Checkout repository lens
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load registered source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/load_producer_env.py \
            --source "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --github-env "$GITHUB_ENV"

      - name: Download normalized repository lens artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.artifact_name }}
          path: _consumer/download

      - name: Install repository lens package
        run: python3 -m pip install -e .

      - name: Verify artifact and build disposable projection
        shell: bash
        run: |
          set -euo pipefail
          artifact="_consumer/download/${SOURCE_ID}-artifact"
          db="_consumer/${SOURCE_ID}.sqlite"
          test -d "$artifact"
          python3 -m theseus_repo_search verify-artifact --artifact "$artifact"
          python3 -m theseus_repo_search build-index --artifact "$artifact" --db "$db"
          python3 - "$db" <<'PY_SQLITE'
          import sqlite3
          import sys

          with sqlite3.connect(sys.argv[1]) as conn:
              observed = conn.execute("PRAGMA quick_check").fetchone()[0]
          if observed != "ok":
              raise SystemExit(f"SQLite quick_check failed: {observed}")
          print(f"sqlite_quick_check={observed}")
          PY_SQLITE

      - name: Replay artifact without source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ matrix.replay_script }}" \
            --db "_consumer/${SOURCE_ID}.sqlite" \
            --artifact "_consumer/download/${SOURCE_ID}-artifact" \
            --descriptor "${{ matrix.source_descriptor }}" \
            --runner producer/runner.json \
            --out "_consumer/${SOURCE_ID}-replay.json"

      - name: Write consumer acceptance receipt
        env:
          RECEIPT_WORKFLOW_REF: ${{ github.workflow_ref }}
          RECEIPT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/write_consumer_receipt.py \
            --artifact "_consumer/download/${SOURCE_ID}-artifact" \
            --db "_consumer/${SOURCE_ID}.sqlite" \
            --replay "_consumer/${SOURCE_ID}-replay.json" \
            --source-descriptor "${{ matrix.source_descriptor }}" \
            --source-descriptor-path "${{ matrix.source_descriptor }}" \
            --runner-config producer/runner.json \
            --runner-config-path producer/runner.json \
            --artifact-name "${{ matrix.artifact_name }}" \
            --repository-head "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --workflow-ref "$RECEIPT_WORKFLOW_REF" \
            --workflow-sha "$RECEIPT_WORKFLOW_SHA" \
            --out "_consumer/${SOURCE_ID}-consumer-receipt.json"

      - name: Upload consumer acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}-consumer-receipt
          path: _consumer/*-consumer-receipt.json
          if-no-files-found: error
          retention-days: 7
