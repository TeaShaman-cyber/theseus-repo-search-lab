          p=Path(os.environ['SOURCE_ROOT'])
          x=dict(source=os.environ['SOURCE_COMMIT'],head=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],stage=2,toolchain=(p/'lean-toolchain').read_text(),manifest=hashlib.sha256((p/'lake-manifest.json').read_bytes()).hexdigest())
          Path('_checkpoint/state.json').write_text(json.dumps(x,sort_keys=True)+'\n')
          PY_STATE
          (cd _checkpoint && sha256sum build.tar.zst state.json > SHA256SUMS)

